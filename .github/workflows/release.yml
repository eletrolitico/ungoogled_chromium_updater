# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build Go App

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Build
        uses: crazy-max/ghaction-xgo@v4
        with:
          xgo_version: latest
          go_version: latest
          dest: build
          prefix: update-chromium
          targets: windows/amd64,darwin/amd64,darwin/arm64
          v: true
          x: false
          race: false
          ldflags: -s -w -X 'main.version=$(git describe --tags)'
          buildmode: default
          trimpath: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build/update-chromium-darwin-amd64
            build/update-chromium-darwin-arm64
            build/update-chromium-windows-amd64.exe
